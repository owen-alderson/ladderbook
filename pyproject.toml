[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "ladderbook"
version = "0.1.0"
description = "Market making research for Kalshi's hourly crypto strike ladders: L2 recorder, options-implied fair value, and a C++ queue-aware backtester."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Owen Alderson" }]
keywords = ["kalshi", "prediction-markets", "market-making", "backtesting", "quant"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15",
    "websockets>=14.0",
    "httpx>=0.27",
    "cryptography>=42",
    "certifi",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ladderbook = "ladderbook.__main__:main"

[project.urls]
Homepage = "https://github.com/owen-alderson/ladderbook"

[tool.scikit-build]
wheel.packages = ["src/ladderbook"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
