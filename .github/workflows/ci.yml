name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DLADDERBOOK_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build -j 4
      - run: ./build/core_tests

  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[dev]"
      - run: pytest
